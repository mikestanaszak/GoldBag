name: Build and verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: goldbag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness:
    name: Player test-client lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/server-tests/package-lock.json
      - name: Install locked test dependencies
        run: npm ci --prefix scripts/server-tests
      - name: Verify client lifecycle and note selection
        run: node --test scripts/server-tests/player-smoke.test.js

  release-tooling:
    name: Release commit analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  verify:
    name: Maven and packaged verification (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify with Maven
        run: mvn -B verify

      - name: Verify the shaded package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find goldbag-plugin/target -maxdepth 1 -type f -name 'GoldBag-*.jar' ! -name '*-original.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one shaded plugin JAR, found %s:\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]:-<none>}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          initial_hash="$(sha256sum "$jar" | cut -d' ' -f1)"
          mvn -B -DskipTests package
          rebuilt_hash="$(sha256sum "$jar" | cut -d' ' -f1)"
          if [[ "$initial_hash" != "$rebuilt_hash" ]]; then
            printf 'Incremental packaging changed the shaded JAR checksum\n' >&2
            exit 1
          fi
          verifier="$RUNNER_TEMP/goldbag-packaged-verifier"
          rm -rf "$verifier"
          mkdir -p "$verifier" ci-artifacts
          javac -encoding UTF-8 -cp "$jar" -d "$verifier" scripts/verification/PackagedJarVerification.java
          java -cp "$verifier:$jar" verification.PackagedJarVerification "$jar"
          cp "$jar" ci-artifacts/
          (cd ci-artifacts && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          printf 'Verified shaded JAR: %s\n' "$jar"
          printf 'SHA-256 file: %s\n' "ci-artifacts/$(basename "$jar").sha256"

      - name: Retain packaged JAR, checksum, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldbag-results-java-${{ matrix.java }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-artifacts/*.jar
            ci-artifacts/*.sha256
            **/target/surefire-reports/**

  release:
    name: Semantic release
    needs: [harness, verify, release-tooling]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Publish versioned plugin and checksum
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
