name: Build and verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: goldbag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify with Maven
        run: mvn -B verify

      - name: Retain test reports and plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldbag-results-java-${{ matrix.java }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            goldbag-plugin/target/*.jar
